version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       orders_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout:  5s
      retries:  10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10

  backend:
    build:
      context:    .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:       postgresql://postgres:password@db:5432/orders_db
      REDIS_URL:          redis://redis:6379
      JWT_SECRET:         orderstream-secret-key-2024
      JWT_ALGORITHM:      HS256
      JWT_EXPIRY_MINUTES: "60"
      CORS_ORIGINS:       "http://localhost:4000,http://localhost:4001,http://localhost:4002,http://localhost:3000,http://localhost:5173"
      APP_ENV:            production
    volumes:
      - ./sql:/app/sql:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context:    frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      - backend

  frontend2:
    build:
      context:    frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4001:80"
    depends_on:
      - backend

  frontend3:
    build:
      context:    frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4002:80"
    depends_on:
      - backend

volumes:
  postgres_data:
